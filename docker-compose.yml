services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  bbq:
    build: .
    network_mode: host
    privileged: true
    environment:
      - CH_URL=http://localhost:8123
      - TEMP_UNITS=${TEMP_UNITS:-f}
      - BULK_INTERVAL=${BULK_INTERVAL:-5}
      - DEBUG=${DEBUG:-false}
      - ES_URL=${ES_URL:-}
      - ES_USER=${ES_USER:-elastic}
      - ES_PASSWORD=${ES_PASSWORD:-}
      - ES_INDEX=${ES_INDEX:-bbq}
      - ES_VERIFY_TLS=${ES_VERIFY_TLS:-true}
    depends_on:
      - clickhouse
    profiles:
      - linux

volumes:
  clickhouse-data:
